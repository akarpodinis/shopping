<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a shopping list</title>
    <link href="{{ url_for('styles', path='/index.css') }}" rel="stylesheet" />
</head>
<body>
    <div class="sticky-heading"><a href="/">Home</a></div>
    <h1>List for {{date}}</h1>
    {% for aisle in aisles %}
    <div>
        <h2>{{aisle.name}}</h2>
        {% for item in aisle.items %}
        <div>
            <input id="{{loop.index0}}" class="check" type="checkbox" name="{{field}}"/>
            <label class="proper-word" for="{{loop.index0}}">{{item.amount}} {{item.name}}</label>
        </div>
        {% endfor %}
    </div>
    {% endfor %}
    <br />
    <h3>Recipes included</h3>
    <div class="quick-item-summary">{{recipes_included}}</div>
</body>
</html>
