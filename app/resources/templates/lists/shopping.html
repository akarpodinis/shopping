<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a shopping list</title>
    <link href="{{ url_for('styles', path='/index.css') }}" rel="stylesheet" />
</head>
<body>
    <h1>Shopping list for {{date}}</h1>
    {% for aisle in aisles %}
    <h2>{{aisle.name}}</h1>
        <ul>
            {% for item in aisle.items %}
            <li><input type="checkbox" />{{item.amount}} {{item.name}}</li>
            {% endfor %}
        </ul>
    </ul>
    {% endfor %}
</body>
</html>
