<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update a shopping list</title>
    <link href="{{ url_for('styles', path='/index.css') }}" rel="stylesheet" />
</head>
<body>
    <div class="sticky-heading"><a href="/">Home</a></div>
    <h1>Update a shopping list</h1>
    <div class="quick-status">{{message}}</div>
    <br />
    <form action="/lists/{{ list.id }}/add-more-items" method="POST">
        <div class="shopping-date"><label>Shopping on </label><input type="date" name="date" value="{{date}}" required /></div>
        <br />
        {% for i in range(1, 5) %}
        <div>Name:<br /><input type="text" name="names" /><br />
            Aisle:<br /><input list="aisle-names" name="aisles" autocomplete="off" /><br />
            Amount:<br /><input type="text" inputmode="numeric" name="amounts"></div><br />
        {% endfor %}
        <datalist id="aisle-names">
            {% for aisle_name in aisle_names %}
            <option value="{{aisle_name}}"></option>
            {% endfor %}
        </datalist>
        <div class="edit-controls sticky-footer">
            <input type="submit" value="Update">
        </div>
    </form>
</body>
</html>
