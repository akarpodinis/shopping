<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Frozen Item</title>
    <link href="{{ url_for('styles', path='/index.css') }}" rel="stylesheet" />
</head>    
<body>
    <div class="sticky-heading"><a href="/">Home</a></div>
    <h1>New Frozen Item</h1>
    <div class="quick-status">{{message}}</div>
    <form action="/freezer-items" method="POST">
        <div><label class="proper-word">Name:</label><br /><input type="text" name="name" required /></div>
        <br />
        <div><label class="proper-word">Amount:</label><br /><input type="text" inputmode="numeric" min="1" name="amount" value="1" required /></div>
        <br />
        <div><label class="proper-word">FDA Freshness guideline:</label>
            <br />
            <select name="fda_item" required>
                {% for guideline in guidelines %}
                <option value="{{guideline.id}}">{{guideline.name}} ({{guideline.duration_days}} days)</option>
                {% endfor %}
            </select>
        </div>
        <div class="hint-text">Start typing to see a list of available FDA Freshness guidelines.</div>
        <br />
        <div><label class="shopping-date">Stored on:</label><input type="date" name="stored_on" value="{{date}}" required /></div>
        <br />
        <div><label class="proper-word">Bag ID:</label><br /><input type="text" name="bag_id" /></div>
        <div class="hint-text">Provide a bag ID if you're returning a bag to the freezer, otherwise leave this blank and you'll get an autmatically-generated one.</div>
        <br />
        <div class="multiple-submit-buttons">
            <button type="submit" name="submit_button" value="done">Add one and done</button>
            <button type="submit" name="submit_button" value="more">Add one and add another</button>
        </div>
    </form>
</body>
</html>
