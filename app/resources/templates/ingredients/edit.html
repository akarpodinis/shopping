<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit an ingredient</title>
    <link href="{{ url_for('styles', path='/index.css') }}" rel="stylesheet" />
</head>
<body>
    <div class="sticky-heading"><a href="/">Home</a></div>
    <h1>Editing {{name}}</h1>
    <form action="/ingredients/{{id}}" method="POST">
        {% for field in fields %}
        {% if types[loop.index0] == "checkbox" %}
        <input id="{{loop.index0}}" class="check" type="{{types[loop.index0]}}" name="{{field}}" {{existing[loop.index0]}}/>
        <label class="proper-word-for-status" for="{{loop.index0}}">{{field}}</label>
        {% else %}
        <div><label class="proper-word">{{field}}</label><input type="{{types[loop.index0]}}" name="{{field}}" value="{{existing[loop.index0]}}"/></div>
        {% endif %}
        <br />
        {% endfor %}
        <br />
        <input type="submit" value="Update" />
    </form>
</body>
</html>
