<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Ingredient</title>
    <link href="{{ url_for('styles', path='/index.css') }}" rel="stylesheet" />
</head>    
<body>
    <div class="sticky-heading"><a href="/">Home</a></div>
    <h1>New Ingredient</h1>
    <div class="quick-status">{{message}}</div>
    <br />
    <form action="/ingredients" method="POST">
        <div><label class="proper-word">Name</label><input type="text" name="name" required /></div>
        <br />
        <div><label class="proper-word">Aisle</label><input list="aisle_names" name="aisle" autocomplete="off" required /></div>
        <br />
        <input id="stocked-input" class="check" type="checkbox" name="stocked" />
        <label class="proper-word-for-status" for="stocked-input">Stocked</label>
        <br />
        <div class="multiple-submit-buttons">
            <button type="submit" name="submit_button" value="done">Add one and done</button>
            <button type="submit" name="submit_button" value="more">Add one and add another</button>
        </div>
        <datalist id="aisle_names">
            {% for aisle_name in aisle_names %}
            <option value="{{aisle_name}}"></option>
            {% endfor %}
        </datalist>
        </form>
    </body>
    </html>
