<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Ingredient</title>
    <link href="{{ url_for('styles', path='/index.css') }}" rel="stylesheet" />
</head>    
<body>
    <div class="sticky-heading"><a href="/">Home</a></div>
    <h1>New Ingredient</h1>
    <form action="/ingredients" method="POST">
        {% for field in fields %}
            {% if types[loop.index0] == "checkbox" %}
            <input id="{{loop.index0}}" class="check" type="{{types[loop.index0]}}" name="{{field}}" {{required[loop.index0]}}/>
            <label class="proper-word-for-status" for="{{loop.index0}}">{{field}}</label>
            {% else %}
            <div><label class="proper-word">{{field}}</label><input type="{{types[loop.index0]}}" name="{{field}}" {{required[loop.index0]}}/></div>
            {% endif %}
            <br />
            {% endfor %}
            <div class="multiple-submit-buttons">
                <button type="submit" name="submit_button" value="done">Add one and done</button>
                <button type="submit" name="submit_button" value="more">Add one and add another</button>
            </div>
    </form>
</body>
</html>
