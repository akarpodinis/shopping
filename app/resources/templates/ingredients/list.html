<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listing ingredients</title>
    <link href="{{ url_for('styles', path='/index.css') }}" rel="stylesheet" />
</head>
<body>
    <div class="sticky-heading"><a href="/">Home</a></div>
    <h1>Ingredients</h1>
    <div class="quick-status">{{message}}</div>
    <ol>
        {% for ingredient in ingredients %}
        {% if ingredient.stocked %}
        <li> <a href="/ingredients/{{ingredient.id}}/edit">Edit</a> {{ingredient.name}} found in aisle {{ingredient.aisle}} (stocked)</li>
        {% else %}
        <li> <a href="/ingredients/{{ingredient.id}}/edit">Edit</a> {{ingredient.name}} found in aisle {{ingredient.aisle}}</li>
        {% endif %}
        {% endfor %}
    </ol>
</body>
</html>
