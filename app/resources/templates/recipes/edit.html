<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Recipe</title>
    <link href="{{ url_for('styles', path='/index.css') }}" rel="stylesheet" />
</head>
<body>
    <div class="sticky-heading"><a href="/">Home</a></div>
    <h1>{{name}}</h1>
    <form action="/recipes/{{id}}/update" method="POST">
        <input type="hidden" name="ingredient_order" value="{{ingredient_order}}" />
        <p>Name <input type="text" name="name" pattern="^[^ ].+[^ ]$" value="{{name}}" required /></p>
        <p>Servings <input type="text" inputmode="numeric" min="1" name="servings" value="{{servings}}" required /></p>
        <div class="input-line">
            <input id="routine-check" class="check" type="checkbox" name="is_routine" {{already_routine}}/>
            <label class="proper-word-for-status" for="routine-check">Routine</label>
        </div>
        <h2>Ingredients</h2>
        {% for ingredient in ingredients %}
        <div class="input-line">
            <label class="recipe-ingredient-label">{{ingredient.name}}</label><label class="recipe-name-label">Amount</label><input class="check-and-scale-scale-text" type="text" inpumode="numeric" name="amounts" value="{{ingredient.amount}}"/></li>
        </div>
        {% endfor %}
        <h2>Notes</h2>
        <div class="notes"><textarea class="notes-textarea" name="notes">{{notes}}</textarea></div>
        <div><input type="submit" value="Update"></div>
    </form>
</body>
</html>
