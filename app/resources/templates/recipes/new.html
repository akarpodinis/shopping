<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Recipe</title>
    <link href="{{ url_for('styles', path='/index.css') }}" rel="stylesheet" />
</head>
<body>
    <div class="sticky-heading"><a href="/">Home</a></div>
    <h1>New Recipe</h1>
    <form action="/recipes" method="POST">
        <p>Name <input type="text" name="name" pattern="^[^ ].+[^ ]$" required /></p>
        <p>Servings <input type="number" min="1" name="servings" value="1" required /></p>
        <div class="input-line">
            <input id="routine-check" class="check" type="checkbox" name="is_routine" {{already_routine}}/>
            <label class="proper-word-for-status" for="routine-check">Routine</label>
        </div>
        <h2>Ingredients</h2>
        {% for name in names %}
        <div class="input-line">
            <input id="{{loop.index0}}" class="check" type="checkbox" name="{{ids[loop.index0]}}||selected" />
            <label class="recipe-name-label" for="{{loop.index0}}">{{name}}</label>
            <input class="check-and-scale-scale-text" type="text" name="{{ids[loop.index0]}}||amount" /><label class="recipe-name-label">Amount</label>
        </div>
        <br />
        {% endfor %}
        <input type="submit" value="Make">
    </form>
</body>
</html>
