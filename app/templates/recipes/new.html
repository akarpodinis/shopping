<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>
    <form action="/recipes", method="POST">
      <div> Name <input type="text" name="name"/>
        <ul>
            {% for name in names %}
            <li><input type="checkbox" name="{{ids[loop.index0]}}||selected"/>{{name}}<input type="text" name="{{ids[loop.index0]}}||amount" />Amount</li>
            {% endfor %}
        </ul>
      </div>
      <div><input type="submit" value="Make"></div>
    </form>
  </body>
</html>
