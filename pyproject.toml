[project]
name = "shopping"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.2",
    "fastapi[standard]>=0.115.6",
    "jinja2==3.1.3",
    "psycopg[binary,pool]>=3.2.9",
    "sqlalchemy>=2.0.41",
    "uvicorn>=0.35.0",
]

[tool.ruff]
exclude=[".git/", ".venv/", "alembic/"]
line-length=100

[tool.isort]
line_length=100
multi_line_output=5
skip_glob=["alembic/*"]
src_paths=["app"]

[tool.mypy]
exclude="alembic"
ignore_missing_imports=true
